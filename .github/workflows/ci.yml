name: Validate portal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: cctv
          POSTGRES_PASSWORD: ci_isolated_database_only
          POSTGRES_DB: cctv_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cctv -d cctv_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://cctv:ci_isolated_database_only@127.0.0.1:5432/cctv_test
      ALLOW_TEST_DATABASE_RESET: '1'
      LOG_LEVEL: silent
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
